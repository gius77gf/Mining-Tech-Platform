<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Flotta — Mezzi & costi</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/deepwork-style.css">
<link rel="stylesheet" href="../../shared/dw-app-shell.css">
<style>
  /* Flotta: accento della palette funzionale deepwork */
  :root { --app-accent:#5b7186; --app-accent2:#7fbcff; }
</style>
</head>
<body class="dw">

<div class="top">
  <a class="dw-home" href="../index.html">⌂ ecosistema</a>
  <h1>FLOTTA <span class="accent">·</span> <span style="font-size:14px;color:var(--muted2);">MEZZI & COSTI</span></h1>
  <div class="sub">Ecosistema Deepwork</div>
</div>
<div class="tour-banner" id="tour-banner" style="display:none;">
  Modalità tour — dati di esempio, sola lettura
</div>

<!-- DASHBOARD -->
<div class="page active" id="page-dash">
  <div class="kpis">
    <div class="kpi ok"><div class="n">11</div><div class="l">Mezzi operativi</div></div>
    <div class="kpi warn"><div class="n">2</div><div class="l">In manutenzione</div></div>
    <div class="kpi warn"><div class="n">3</div><div class="l">Tagliandi 30gg</div></div>
    <div class="kpi accent"><div class="n">€8.4k</div><div class="l">Carburante mese</div></div>
  </div>

  <div class="sec">Attenzione</div>
  <div id="alert-list"></div>
</div>

<div class="page" id="page-mez">
  <div class="sec">Parco mezzi</div>
  <div id="mez-list"></div>
  <div class="sec">Registro ore</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <select class="dw-input" id="ore-mezzo" style="flex:2;min-width:150px;"></select>
    <input class="dw-input" id="ore-nuove" type="number" placeholder="Ore attuali" style="flex:1;min-width:110px;">
    <button class="dw-btn" id="btn-ore" style="width:auto;">Registra</button>
  </div>
  <div class="note" id="ore-esito" style="text-align:left;"></div>
</div>

<div class="page" id="page-man">
  <div class="sec">Programmate</div>
  <div id="man-list"></div>
  <div class="sec">Nuova manutenzione</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <input class="dw-input" id="man-titolo" placeholder="Titolo (es. Tagliando 500h)" style="flex:2;min-width:150px;">
    <select class="dw-input" id="man-mezzo" style="flex:1;min-width:130px;"></select>
    <input class="dw-input" id="man-data" type="date" style="flex:1;min-width:130px;">
    <button class="dw-btn" id="btn-man" style="width:auto;">Pianifica</button>
  </div>
</div>

<div class="page" id="page-cos">
  <div class="sec">Costi del mese</div>
  <div id="cos-list"></div>
  <div class="note" id="mode-note" style="text-align:left;"></div>
</div>

<div class="nav">
  <button id="nav-dash" class="active" onclick="go('dash')"><span class="ico">▦</span>Quadro</button>
  <button id="nav-mez" onclick="go('mez')"><span class="ico">🚚</span>Mezzi</button>
  <button id="nav-man" onclick="go('man')"><span class="ico">🔧</span>Manutenzioni</button>
  <button id="nav-cos" onclick="go('cos')"><span class="ico">💶</span>Costi</button>
</div>

<script>
  function go(id) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
    document.getElementById("page-" + id).classList.add("active");
    document.getElementById("nav-" + id).classList.add("active");
    window.scrollTo(0, 0);
  }
</script>

<script type="module">
  import { flottaData, urgenza, kpiFrom } from "./flotta-data.js";
  import { mountExit } from "../../shared/deepwork-id-client/dw-shell.js";
  const $ = (id) => document.getElementById(id);
  const MB = { operativo: ["ok","Operativo"], fermo: ["danger","Fermo"], verifica: ["warn","Verifica"] };
  const sig = (n) => (n||"?").split(" ")[0].slice(0,2).toUpperCase();
  const eur = (v) => "€" + (+v||0).toLocaleString("it-IT");

  const db = await flottaData();
  mountExit(db);
  if (db.mode !== "live") $("tour-banner").style.display = "block";
  $("mode-note").textContent = db.mode === "live" ? "Dati reali della tua organizzazione." : "Dati di esempio ("+db.mode+"): le modifiche non vengono salvate.";

  let MEZ=[], MAN=[], COS=[];
  const MEZ_NEXT = { operativo: "verifica", verifica: "fermo", fermo: "operativo" };
  async function refresh(){
    [MEZ,MAN,COS] = await Promise.all([db.mezzi(), db.manutenzioni(), db.costi()]);
    const k = kpiFrom(MEZ,MAN,COS);
    const kn = document.querySelectorAll(".kpis .kpi .n");
    if (kn[0]) kn[0].textContent = k.operativi;
    if (kn[1]) kn[1].textContent = k.inManutenzione;
    if (kn[2]) kn[2].textContent = k.tagliandi30;
    if (kn[3]) kn[3].textContent = "€" + (k.carburante/1000).toFixed(1) + "k";

    const alerts = [
      ...MEZ.filter(m => m.stato !== "operativo").map(m => ({ t: m.nome, d: m.area || "—", u: MB[m.stato] })),
      ...MAN.map(n => ({ t: n.titolo + " — " + n.mezzo, d: n.dataPrevista.split("-").reverse().join("/"), u: [urgenza(n.dataPrevista).cls, urgenza(n.dataPrevista).label] }))
        .filter(a => a.u[0] !== "ok"),
    ].slice(0, 4);
    $("alert-list").innerHTML = alerts.map(a => `<div class="item">
      <div class="avatar">${sig(a.t)}</div>
      <div class="info"><div class="name">${a.t}</div><div class="meta">${a.d}</div></div>
      <span class="badge ${a.u[0]}">${a.u[1]}</span></div>`).join("") || '<div class="note">Nessuna criticità sul parco mezzi.</div>';

    $("mez-list").innerHTML = MEZ.map(m => `<div class="item" data-mezzo="${m.id}" style="cursor:pointer" title="Tocca per cambiare stato">
      <div class="avatar">${sig(m.nome)}</div>
      <div class="info"><div class="name">${m.nome}</div><div class="meta">${(m.ore||0).toLocaleString("it-IT")} h${m.area ? " · " + m.area : ""}</div></div>
      <span class="badge ${MB[m.stato][0]}">${MB[m.stato][1]}</span></div>`).join("");

    $("man-list").innerHTML = MAN.slice().sort((a,b)=>a.dataPrevista<b.dataPrevista?-1:1).map(n => { const u = urgenza(n.dataPrevista);
      return `<div class="item"><div class="info"><div class="name">${n.titolo} — ${n.mezzo}</div><div class="meta">Previsto ${n.dataPrevista.split("-").reverse().join("/")}</div></div>
      <span class="badge ${u.cls}">${u.label}</span>
      <span class="arr" style="cursor:pointer" title="Segna come eseguita" data-man-done="${n.id}">✓</span></div>`; }).join("")
      || '<div class="note" style="text-align:left;">Nessuna manutenzione programmata.</div>';

    $("cos-list").innerHTML = COS.map(c => `<div class="item">
      <div class="info"><div class="name">${c.voce}</div><div class="meta">${c.nota || ""}</div></div>
      <span class="badge ok">${eur(c.importo)}</span></div>`).join("");

    const opts = MEZ.map(m => `<option value="${m.id}">${m.nome.split(" — ")[0]}</option>`).join("");
    $("ore-mezzo").innerHTML = opts;
    $("man-mezzo").innerHTML = MEZ.map(m => `<option>${m.nome.split(" — ")[0]}</option>`).join("");
  }

  document.addEventListener("click", async (e) => {
    const done = e.target.getAttribute && e.target.getAttribute("data-man-done");
    if (done) { const n = MAN.find(x => x.id === done);
      if (n && confirm("Segnare come eseguita «" + n.titolo + " — " + n.mezzo + "»? Verrà tolta dalle programmate.")) {
        await db.rimuovi("manutenzioni", done); await refresh(); } return; }
    const it = e.target.closest && e.target.closest("[data-mezzo]");
    if (it) { const m = MEZ.find(x => x.id === it.getAttribute("data-mezzo"));
      await db.aggiorna("mezzi", m.id, { stato: MEZ_NEXT[m.stato] || "operativo" }); await refresh(); }
  });
  $("btn-ore").onclick = async () => {
    const id = $("ore-mezzo").value, ore = +$("ore-nuove").value;
    const m = MEZ.find(x => x.id === id);
    if (!m || !ore) { $("ore-esito").textContent = "Scegli il mezzo e scrivi le ore attuali."; $("ore-nuove").style.borderColor = "var(--danger)"; return; }
    if (ore < (m.ore||0)) { $("ore-esito").textContent = "Ore (" + ore + ") inferiori alle attuali (" + (m.ore||0) + "): il contatore non può scendere."; $("ore-nuove").style.borderColor = "var(--danger)"; return; }
    $("ore-nuove").style.borderColor = ""; $("ore-esito").textContent = "Registrate " + ore + " h su " + m.nome.split(" — ")[0] + ".";
    await db.aggiorna("mezzi", id, { ore }); $("ore-nuove").value = ""; await refresh();
  };
  $("btn-man").onclick = async () => {
    const titolo = $("man-titolo").value.trim(), dataPrevista = $("man-data").value;
    if (!titolo || !dataPrevista) return;
    await db.aggiungi("manutenzioni", { titolo, mezzo: $("man-mezzo").value, dataPrevista });
    $("man-titolo").value = ""; $("man-data").value = ""; await refresh();
  };
  await refresh();
</script>
</body>
</html>
