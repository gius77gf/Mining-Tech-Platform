<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sentinella — Ambiente / HSE</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/deepwork-style.css">
<link rel="stylesheet" href="../../shared/dw-app-shell.css">
<style>
  /* Sentinella: accento della palette funzionale deepwork */
  :root { --app-accent:#6b6459; --app-accent2:#c7b794; }
</style>
</head>
<body class="dw">

<div class="top">
  <a class="dw-home" href="../index.html">⌂ ecosistema</a>
  <h1>SENTINELLA <span class="accent">·</span> <span style="font-size:14px;color:var(--muted2);">AMBIENTE / HSE</span></h1>
  <div class="sub">Ecosistema Deepwork</div>
</div>
<div class="tour-banner" id="tour-banner" style="display:none;">
  Modalità tour — dati di esempio, sola lettura
</div>

<!-- DASHBOARD -->
<div class="page active" id="page-dash">
  <div class="kpis">
    <div class="kpi accent" style="cursor:pointer" data-goto="mon" data-filtro="tutti" title="Vedi i monitoraggi"><div class="n">6</div><div class="l">Monitoraggi attivi</div></div>
    <div class="kpi danger" style="cursor:pointer" data-goto="mon" data-filtro="danger" title="Vedi i superamenti"><div class="n">1</div><div class="l">Superamenti soglia</div></div>
    <div class="kpi warn" style="cursor:pointer" data-goto="ade" title="Vedi gli adempimenti"><div class="n">3</div><div class="l">Adempimenti 30gg</div></div>
    <div class="kpi ok" style="cursor:pointer" data-goto="mon" data-filtro="tutti" title="Vedi i monitoraggi"><div class="n">12</div><div class="l">Campionamenti mese</div></div>
  </div>

  <div class="sec">Allerte</div>
  <div id="all-list"></div>
</div>

<div class="page" id="page-mon">
  <div class="sec">Centraline e sensori</div>
  <div id="mon-filtri" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
    <button class="dw-btn secondary" data-filtro="tutti" style="width:auto;min-height:34px;padding:4px 12px;font-size:12px;">Tutti</button>
    <button class="dw-btn secondary" data-filtro="ok" style="width:auto;min-height:34px;padding:4px 12px;font-size:12px;">Conformi</button>
    <button class="dw-btn secondary" data-filtro="warn" style="width:auto;min-height:34px;padding:4px 12px;font-size:12px;">Attenzione</button>
    <button class="dw-btn secondary" data-filtro="danger" style="width:auto;min-height:34px;padding:4px 12px;font-size:12px;">Superamenti</button>
  </div>
  <div id="mon-list"></div>
  <div class="sec">Registra misura</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <select class="dw-input" id="mis-sensore" style="flex:2;min-width:150px;"></select>
    <input class="dw-input" id="mis-valore" type="number" step="0.1" placeholder="Valore" style="flex:1;min-width:90px;">
    <button class="dw-btn" id="btn-mis" style="width:auto;">Registra</button>
  </div>
  <div class="note" id="mis-esito" style="text-align:left;"></div>
  <div class="sec">Nuovo sensore</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <input class="dw-input" id="sen-nome" placeholder="Nome (es. Polveri P2 — piazzale)" style="flex:2;min-width:160px;">
    <input class="dw-input" id="sen-unita" placeholder="Unità (es. µg/m³)" style="flex:1;min-width:90px;">
    <input class="dw-input" id="sen-soglia" type="number" step="0.1" min="0" placeholder="Soglia" style="flex:1;min-width:80px;">
    <button class="dw-btn" id="btn-sen" style="width:auto;">Aggiungi</button>
  </div>
</div>

<div class="page" id="page-ade">
  <div class="sec">Scadenze ambientali</div>
  <div id="ade-list"></div>
  <div class="sec">Nuovo adempimento</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <input class="dw-input" id="ade-titolo" placeholder="Titolo (es. Relazione annuale AUA)" style="flex:2;min-width:160px;">
    <input class="dw-input" id="ade-ente" placeholder="Ente (es. ARPA)" style="flex:1;min-width:90px;">
    <input class="dw-input" id="ade-data" type="date" style="flex:1;min-width:130px;">
    <button class="dw-btn" id="btn-ade" style="width:auto;">Aggiungi</button>
  </div>
  <div class="note" id="ade-esito" style="text-align:left;"></div>
  </div>

<div class="page" id="page-reg">
  <div class="sec">Registri</div>
  <div id="reg-list"></div>
  <button class="dw-btn secondary" id="btn-export-amb" style="width:auto;margin-top:8px;">Esporta monitoraggi e adempimenti (CSV)</button>
  <div class="note" id="mode-note" style="text-align:left;"></div>
</div>

<div class="nav">
  <button id="nav-dash" class="active" onclick="go('dash')"><span class="ico">▦</span>Quadro</button>
  <button id="nav-mon" onclick="go('mon')"><span class="ico">📡</span>Monitoraggi</button>
  <button id="nav-ade" onclick="go('ade')"><span class="ico">📋</span>Adempimenti</button>
  <button id="nav-reg" onclick="go('reg')"><span class="ico">📚</span>Registri</button>
</div>

<script>
  function go(id) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
    document.getElementById("page-" + id).classList.add("active");
    document.getElementById("nav-" + id).classList.add("active");
    window.scrollTo(0, 0);
  }
</script>

<script type="module">
  import { sentinellaData, statoMisura, giorni, kpiFrom } from "./sentinella-data.js";
  import { mountExit, esc, csvCell } from "../../shared/deepwork-id-client/dw-shell.js";
  const $ = (id) => document.getElementById(id);
  const fmtD = (iso) => iso ? iso.split("-").reverse().join("/") : "—";
  const RB = { aggiornato: ["ok","Aggiornato"], "in-attesa": ["warn","In attesa"] };

  const db = await sentinellaData();
  mountExit(db);
  if (db.mode !== "live") $("tour-banner").style.display = "block";
  $("mode-note").textContent = db.mode === "live" ? "Dati reali della tua organizzazione." : "Dati di esempio ("+db.mode+"): le modifiche non vengono salvate.";

  let MON=[], ADE=[], REG=[];
  let filtroMon = "tutti";
  // scorciatoia: toccare un KPI del quadro porta alla lista pertinente
  document.querySelector(".kpis").addEventListener("click", (e) => {
    const card = e.target.closest("[data-goto]"); if (!card) return;
    const filtro = card.getAttribute("data-filtro"); if (filtro) filtroMon = filtro;
    go(card.getAttribute("data-goto")); refresh();
  });
  $("mon-filtri").addEventListener("click", (e) => {
    const f = e.target.getAttribute && e.target.getAttribute("data-filtro");
    if (f) { filtroMon = f; refresh(); }
  });
  async function refresh(){
    [MON,ADE,REG] = await Promise.all([db.monitoraggi(), db.adempimenti(), db.registri()]);
    const k = kpiFrom(MON,ADE);
    const kn = document.querySelectorAll(".kpis .kpi .n");
    if (kn[0]) kn[0].textContent = k.attivi;
    if (kn[1]) kn[1].textContent = k.superamenti;
    if (kn[2]) kn[2].textContent = k.adempimenti30;
    if (kn[3]) kn[3].textContent = MON.length;   // campionamenti registrati (semplice: n. sensori con misura)

    const allerte = [
      ...MON.map(m => ({ m, st: statoMisura(m) })).filter(x => x.st.cls !== "ok")
        .map(x => ({ t: x.m.nome, d: x.m.valore + " " + x.m.unita + " / soglia " + x.m.soglia + (x.m.nota ? " · " + x.m.nota : ""), b: [x.st.cls, x.st.label] })),
      ...ADE.filter(a => giorni(a.scadenza) <= 30)
        .map(a => ({ t: a.titolo, d: (a.ente!=="—"?a.ente+" · ":"") + "entro " + fmtD(a.scadenza), b: ["warn", giorni(a.scadenza) + " gg"] })),
    ].slice(0, 4);
    $("all-list").innerHTML = allerte.map(a => `<div class="item">
      <div class="info"><div class="name">${esc(a.t)}</div><div class="meta">${esc(a.d)}</div></div>
      <span class="badge ${a.b[0]}">${a.b[1]}</span></div>`).join("") || '<div class="note">Nessuna allerta: tutto conforme.</div>';

    $("mon-list").innerHTML = MON.map(m => ({ m, st: statoMisura(m) }))
      .filter(x => filtroMon === "tutti" || x.st.cls === filtroMon)
      .sort((a, b) => b.st.ratio - a.st.ratio)
      .map(({m, st}) => { const ult = (m.letture || []).slice(-3).map(l => l.valore).join(" → ");
      return `<div class="item"><div class="info"><div class="name">${esc(m.nome)}</div>
      <div class="meta">${m.valore} ${esc(m.unita)} / soglia ${m.soglia} (${Math.round(st.ratio*100)}%)${ult ? " · ultime: " + ult : ""}${m.nota ? " · " + esc(m.nota) : ""}</div></div>
      <span class="badge ${st.cls}">${st.label}</span>
      <span class="arr" style="cursor:pointer" title="Rimuovi sensore" data-del-mon="${m.id}">✕</span></div>`; }).join("")
      || '<div class="note" style="text-align:left;">'+(filtroMon==="tutti"?"Nessun sensore configurato.":"Nessun sensore in questa categoria.")+'</div>';
    document.querySelectorAll("#mon-filtri [data-filtro]").forEach(b =>
      b.style.borderColor = b.getAttribute("data-filtro") === filtroMon ? "var(--app-accent)" : "");

    $("ade-list").innerHTML = ADE.slice().sort((a,b)=>a.scadenza<b.scadenza?-1:1).map(a => { const g = giorni(a.scadenza);
      const b = g < 0 ? ["danger","Scaduto"] : (g <= 30 ? ["warn", g + " gg"] : ["ok", g + " gg"]);
      return `<div class="item"><div class="info"><div class="name">${esc(a.titolo)}</div><div class="meta">${a.ente!=="—"?esc(a.ente)+" · ":""}entro ${fmtD(a.scadenza)}</div></div>
      <span class="badge ${b[0]}">${b[1]}</span>
      <span class="arr" style="cursor:pointer" title="Segna come eseguito" data-ade-done="${a.id}">✓</span></div>`; }).join("")
      || '<div class="note" style="text-align:left;">Nessun adempimento in scadenza.</div>';

    $("reg-list").innerHTML = REG.slice().sort((a,b)=>(a.stato==="in-attesa"?0:1)-(b.stato==="in-attesa"?0:1)).map(r => `<div class="item" data-reg="${r.id}" style="cursor:pointer" title="${r.stato==="in-attesa" ? "Tocca per segnare aggiornato" : "Tocca per rimettere in attesa"}">
      <div class="info"><div class="name">${esc(r.titolo)}</div><div class="meta">${esc(r.nota || "")}</div></div>
      <span class="badge ${RB[r.stato][0]}">${RB[r.stato][1]}</span></div>`).join("")
      || '<div class="note" style="text-align:left;">Nessuna voce nel registro.</div>';

    $("mis-sensore").innerHTML = MON.map(m => `<option value="${m.id}">${esc(m.nome.split(" — ")[0])}</option>`).join("");
  }

  document.addEventListener("click", async (e) => {
    const done = e.target.getAttribute && e.target.getAttribute("data-ade-done");
    if (done) { const a = ADE.find(x => x.id === done);
      if (a && confirm("Segnare come eseguito «" + a.titolo + "»? Verrà tolto dalle scadenze.")) {
        await db.rimuovi("adempimenti", done); await refresh(); } return; }
    const delMon = e.target.getAttribute && e.target.getAttribute("data-del-mon");
    if (delMon) { const m = MON.find(x => x.id === delMon);
      if (m && confirm("Rimuovere il sensore «" + m.nome + "»? Anche lo storico delle misure verrà perso.")) {
        await db.rimuovi("monitoraggi", delMon); await refresh(); } return; }
    const it = e.target.closest && e.target.closest("[data-reg]");
    if (it) { const r = REG.find(x => x.id === it.getAttribute("data-reg"));
      // toggle bidirezionale, SENZA sovrascrivere la nota originale del registro
      if (r) { await db.aggiorna("registri", r.id, { stato: r.stato === "in-attesa" ? "aggiornato" : "in-attesa" }); await refresh(); } }
  });
  $("btn-export-amb").onclick = () => {
    // per ARPA/consulente ambientale: stato calcolato + storico letture
    let csv = "tipo;nome;valore;unita;soglia;stato;dettaglio\n";
    for (const m of MON) { const st = statoMisura(m);
      const storico = (m.letture || []).map(l => l.data + ":" + l.valore).join(" ");
      csv += `monitoraggio;${csvCell(m.nome)};${m.valore};${csvCell(m.unita)};${m.soglia};${st.label};${csvCell(storico)}\n`; }
    for (const a of ADE) { const g = giorni(a.scadenza);
      csv += `adempimento;${csvCell(a.titolo)};;;;${g < 0 ? "scaduto" : "tra " + g + " gg"};${csvCell((a.ente!=="—"?a.ente+" · ":"")+"entro "+a.scadenza)}\n`; }
    const el = document.createElement("a");
    el.href = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
    el.download = "sentinella_ambiente.csv"; el.click();
    $("mode-note").textContent = "Esportati " + MON.length + " monitoraggi e " + ADE.length + " adempimenti (CSV).";
  };
  $("btn-ade").onclick = async () => {
    const titolo = $("ade-titolo").value.trim(), ente = $("ade-ente").value.trim() || "—", scadenza = $("ade-data").value;
    if (!titolo || !scadenza) {
      $("ade-titolo").style.borderColor = titolo ? "" : "var(--danger)";
      $("ade-data").style.borderColor = scadenza ? "" : "var(--danger)";
      $("ade-esito").textContent = "Servono titolo e data di scadenza."; return;
    }
    $("ade-titolo").style.borderColor = ""; $("ade-data").style.borderColor = "";
    await db.aggiungi("adempimenti", { titolo, ente, scadenza });
    $("ade-titolo").value = ""; $("ade-ente").value = ""; $("ade-data").value = "";
    $("ade-esito").textContent = "Adempimento aggiunto: " + titolo + " entro " + fmtD(scadenza) + ".";
    await refresh();
  };
  $("btn-sen").onclick = async () => {
    const nome = $("sen-nome").value.trim(), unita = $("sen-unita").value.trim(), soglia = +$("sen-soglia").value;
    if (!nome || !unita || !(soglia > 0)) {
      [["sen-nome",nome],["sen-unita",unita],["sen-soglia",soglia>0]].forEach(([i,v]) => $(i).style.borderColor = v ? "" : "var(--danger)");
      $("mis-esito").textContent = "Servono nome, unità di misura e soglia (>0) per aggiungere il sensore."; return;
    }
    ["sen-nome","sen-unita","sen-soglia"].forEach(i => $(i).style.borderColor = "");
    await db.aggiungi("monitoraggi", { nome, unita, soglia, valore: 0, letture: [] });
    $("sen-nome").value = ""; $("sen-unita").value = ""; $("sen-soglia").value = "";
    $("mis-esito").textContent = "Sensore " + nome + " aggiunto (soglia " + soglia + " " + unita + ").";
    $("sen-nome").focus();   // torna al primo campo per aggiungere subito il prossimo
    await refresh();
  };
  $("btn-mis").onclick = async () => {
    const id = $("mis-sensore").value, raw = $("mis-valore").value.trim(), valore = +raw;
    if (!id || raw === "" || isNaN(valore) || valore < 0) {
      $("mis-valore").style.borderColor = "var(--danger)";
      $("mis-esito").textContent = "Scrivi un valore valido (zero compreso) per registrare la misura."; return;
    }
    $("mis-valore").style.borderColor = "";
    const m = MON.find(x => x.id === id);
    // storico: ogni registrazione si ACCODA alle letture (max 50), non
    // si perde sovrascrivendo il solo ultimo valore
    const letture = [ ...((m && m.letture) || []), { data: new Date().toISOString().slice(0,10), valore } ].slice(-50);
    await db.aggiorna("monitoraggi", id, { valore, letture });
    const st = statoMisura({ ...m, valore });
    $("mis-esito").textContent = "Misura registrata su " + (m ? m.nome.split(" — ")[0] : id) + ": " + valore + (m ? " " + m.unita : "") + " → " + st.label + ".";
    $("mis-valore").value = ""; await refresh();
  };
  // Recupero errore: appena l'utente corregge un campo, togli il bordo
  // rosso e il messaggio di esito, così l'avviso non resta appeso.
  const clearErr = (inputId, esitoId) => $(inputId).addEventListener("input", () => {
    $(inputId).style.borderColor = ""; if (esitoId) $(esitoId).textContent = "";
  });
  ["ade-titolo","ade-data"].forEach(i => clearErr(i, "ade-esito"));
  ["sen-nome","sen-unita","sen-soglia"].forEach(i => clearErr(i, "mis-esito"));
  clearErr("mis-valore", "mis-esito");
  // Invio da tastiera: premere Invio in un campo del form equivale a
  // toccare il pulsante — data entry più rapida senza spostare il dito.
  const enterSubmit = (inputIds, btnId) => inputIds.forEach(id =>
    $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); $(btnId).click(); } }));
  enterSubmit(["ade-titolo", "ade-ente", "ade-data"], "btn-ade");
  enterSubmit(["sen-nome", "sen-unita", "sen-soglia"], "btn-sen");
  enterSubmit(["mis-valore"], "btn-mis");
  await refresh();
</script>
</body>
</html>
